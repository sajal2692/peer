name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Python versions: 3.12 is the oldest supported and the primary version for lint, coverage
# and releases, and the matrix runs up to the newest stable release. A separate job tries the newest build available, pre-releases included, so a break
# in an upcoming Python shows up early without blocking merges.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck install.sh
      - name: No em dashes in the repo
        run: python3 scripts/check_dashes.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          # One macOS job with the oldest supported version: macOS runners are scarce and
          # queue for a long time, and the code paths do not differ by Python version.
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m unittest discover -s tests -v
      - name: Install into a fresh home
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh
          "$HOME/.local/bin/peer" --version
          test -L "$HOME/.claude/skills/peer" && test -L "$HOME/.codex/skills/peer"
      - name: Install with the one-line installer, then update it
        run: bash scripts/test_one_line_install.sh

  newest-python:
    name: test (newest Python, pre-releases included)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          allow-prereleases: true
          # Look past the runner's cached versions for the newest build.
          check-latest: true
      - run: python --version
      - run: python -W error -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install coverage
      - run: coverage run -m unittest discover -s tests
      - run: coverage report --fail-under=80
