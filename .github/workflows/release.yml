name: release

on:
  push:
    tags: ["v*"]

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the tag matches peer's version
        run: |
          version="$(python3 peer.py --version | cut -d' ' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match peer $version"; exit 1; }
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 == "## " v || $0 == "## [" v "]" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "peer $GITHUB_REF_NAME" --notes-file notes.md --draft
